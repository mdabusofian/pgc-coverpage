<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Cover Page Generator - Patiya Govt. College</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&family=Cinzel:wght@600;700;800&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Strict A4 Pixel-Perfect Vector Dimension Enforcer */
        .pdf-page-container {
            width: 794px;
            height: 1123px;
            min-width: 794px;
            min-height: 1123px;
            background: #FFFFFF;
            padding: 70px 65px 55px 65px;
            box-sizing: border-box;
            position: relative;
        }

        /* Fluid Control Dashboard Scale Engine */
        .preview-wrapper {
            overflow: auto;
            display: flex;
            justify-content: center;
            background-color: #0F172A;
            border-radius: 16px;
            padding: 30px 15px;
            height: calc(100vh - 120px);
            box-shadow: inset 0 4px 20px rgba(0,0,0,0.4);
        }

        .preview-scale {
            transform: scale(0.52);
            transform-origin: top center;
            width: 794px;
            height: 1123px;
        }
        @media (min-width: 1024px) { .preview-scale { transform: scale(0.58); } }
        @media (min-width: 1280px) { .preview-scale { transform: scale(0.68); } }
        @media (min-width: 1536px) { .preview-scale { transform: scale(0.74); } }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen overflow-hidden">

    <div class="h-screen flex flex-col lg:flex-row">

                <div class="flex items-center gap-3 pb-4 border-b border-slate-800">

                    <div>
                        <h1 class="text-sm font-bold tracking-wide text-slate-200 uppercase">Cover Engine v5.0</h1>

                    </div>
                </div>

                        <button onclick="switchTemplate(1)" id="btn-t1" class="w-full text-left p-3 rounded-xl border-2 border-blue-600 bg-blue-950/40 transition-all">
                            <span class="block text-xs font-bold text-slate-200">Template 1: Modern Blocks (Navy Theme)</span>
                            <span class="block text-[10px] text-slate-400 mt-0.5">Horizontal bold accent strip block layout</span>
                        </button>
                        <button onclick="switchTemplate(2)" id="btn-t2" class="w-full text-left p-3 rounded-xl border-2 border-slate-800 hover:border-slate-700 bg-slate-950/20 transition-all">

                            <span class="block text-[10px] text-slate-400 mt-0.5">Top-accent bar with clean geometric layout</span>
                        </button>
                        <button onclick="switchTemplate(3)" id="btn-t3" class="w-full text-left p-3 rounded-xl border-2 border-slate-800 hover:border-slate-700 bg-slate-950/20 transition-all">
                            <span class="block text-xs font-bold text-slate-200">Template 3: Corporate Line (Classic Academic)</span>
                            <span class="block text-[10px] text-slate-400 mt-0.5">Top centered logo with clean single rule anchor</span>
                        </button>
                        <button onclick="switchTemplate(4)" id="btn-t4" class="w-full text-left p-3 rounded-xl border-2 border-slate-800 hover:border-slate-700 bg-slate-950/20 transition-all">
                            <span class="block text-xs font-bold text-slate-200">Template 4: Emerald Crest (Luxury Minimal)</span>
                            <span class="block text-[10px] text-slate-400 mt-0.5">Double vertical frame structure with Deep Emerald theme</span>
                        </button>
                        <button onclick="switchTemplate(5)" id="btn-t5" class="w-full text-left p-3 rounded-xl border-2 border-slate-800 hover:border-slate-700 bg-slate-950/20 transition-all">
                            <span class="block text-xs font-bold text-slate-200">Template 5: Slate Monograph (Vintage Minimal)</span>

                </div>

                        </div>
                    </div>

                        <div class="grid grid-cols-2 gap-2 mb-2">
                            <input type="text" id="inRoll" value="918273" placeholder="Roll Number" oninput="syncEngine()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-blue-500">
                            <input type="text" id="inReg" value="18273645" placeholder="Registration No" oninput="syncEngine()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-blue-500">
                        </div>

                            <input type="text" id="inSession" value="2022-23" placeholder="Session" oninput="syncEngine()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 text-xs focus:outline-none focus:border-blue-500">
                        </div>
                    </div>

                    <div class="border-t border-slate-800/80 pt-3">

                    </div>

        </div>

        <div class="flex-grow p-6 flex flex-col justify-center bg-slate-950">
            <div class="preview-wrapper">
                <div class="preview-scale">

                        </div>

        // SWAP ARCHITECTURE CONTROLLER
        function switchTemplate(id) {
            activeTemplateId = id;
            for(let i=1; i<=5; i++) {
                const btn = document.getElementById(`btn-t${i}`);
                if(i === id) {
                    btn.classList.add('border-blue-600', 'bg-blue-950/40');
                    btn.classList.remove('border-slate-800', 'bg-slate-950/20');
                } else {
                    btn.classList.remove('border-blue-600', 'bg-blue-950/40');
                    btn.classList.add('border-slate-800', 'bg-slate-950/20');
                }
            }
            syncEngine();
        }

        // COMPLIANCE DATA SYNCHRONIZER
        function syncEngine() {
            const payload = {
                title: document.getElementById('inTitle').value,
                courseTitle: document.getElementById('inCourseTitle').value,
                courseCode: document.getElementById('inCourseCode').value,
                studentName: document.getElementById('inStudentName').value,
                roll: document.getElementById('inRoll').value,
                reg: document.getElementById('inReg').value,
                year: document.getElementById('inYear').value,
                session: document.getElementById('inSession').value,
                teacher: document.getElementById('inTeacherName').value,
                designation: document.getElementById('inDesignation').value,
                date: document.getElementById('inDate').value
            };

            const container = document.getElementById('renderTarget');
            
            if(activeTemplateId === 1) container.innerHTML = generateTemplate1(payload);
            else if(activeTemplateId === 2) container.innerHTML = generateTemplate2(payload);
            else if(activeTemplateId === 3) container.innerHTML = generateTemplate3(payload);
            else if(activeTemplateId === 4) container.innerHTML = generateTemplate4(payload);
            else if(activeTemplateId === 5) container.innerHTML = generateTemplate5(payload);
        }

        // VECTOR GRAPHICS EXPORTER
        function triggerPdfExport() {
            const element = document.getElementById('renderTarget');
            const student = document.getElementById('inStudentName').value || 'Student';
            const filenameStr = `Academic_Cover_T${activeTemplateId}_${student.replace(/\s+/g, '_')}.pdf`;

            const opt = {
                margin:       0,
                filename:     filenameStr,
                image:        { type: 'jpeg', quality: 1.0 },
                html2canvas:  { 
                    scale: 2, 
                    useCORS: true, 
                    logging: false,
                    letterRendering: true,
                    width: 794,
                    height: 1123
                },
                jsPDF:        { unit: 'pt', format: 'a4', orientation: 'portrait' }
            };

            html2pdf().set(opt).from(element).save();
        }

        // STARTUP HOOK
        window.onload = function() {
            syncEngine();
        };
    </script>
