<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> PGC Assignment Cover Page Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&family=Cinzel:wght@700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-font-smoothing: antialiased;
        }
        
        /* Rigid A4 Layout Configuration with Enhanced Strict Padding Grid */
        .pdf-page-container {
            width: 794px;
            height: 1123px;
            min-width: 794px;
            min-height: 1123px;
            max-width: 794px;
            max-height: 1123px;
            background: #FFFFFF;
            padding: 70px 75px 60px 75px;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* Premium Input Elements Grid Config */
        .premium-input {
            width: 100%;
            background-color: #F8FAFC;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 11px 15px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #0F172A;
            transition: all 0.25s ease;
        }
        .premium-input:focus {
            background-color: #FFFFFF;
            border-color: #2563EB;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
            outline: none;
        }
        .premium-label {
            display: block;
            font-size: 0.72rem;
            font-weight: 800;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
        }

        /* Workspace Live Preview Sandbox Wrapper */
        .preview-wrapper {
            overflow: auto;
            display: flex;
            justify-content: center;
            background-color: #CBD5E1;
            border-radius: 20px;
            padding: 35px 15px;
            height: 74vh;
            box-shadow: inset 0 4px 14px rgba(15, 23, 42, 0.1);
            border: 1px solid #94A3B8;
        }

        @media (min-width: 1024px) {
            .preview-wrapper {
                height: calc(100vh - 215px);
                padding: 40px 20px;
            }
        }

        /* Continuous High Fidelity Scaling Engine Matrix */
        .preview-scale {
            transform: scale(0.40);
            transform-origin: top center;
            width: 794px;
            height: 1123px;
        }
        @media (min-width: 400px) { .preview-scale { transform: scale(0.45); } }
        @media (min-width: 640px) { .preview-scale { transform: scale(0.62); } }
        @media (min-width: 1024px) { .preview-scale { transform: scale(0.52); } }
        @media (min-width: 1280px) { .preview-scale { transform: scale(0.64); } }
        @media (min-width: 1536px) { .preview-scale { transform: scale(0.72); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <div class="w-full flex flex-col">
        
        <header class="w-full bg-white border-b border-slate-200 p-5 text-center shadow-xs">
            <h1 class="text-2xl font-black tracking-tight text-slate-900 uppercase font-['Montserrat']">
                Patiya Govt. College
            </h1>
            <p class="text-xs font-black text-amber-700 tracking-widest uppercase mt-1">
                Department of Chemistry
            </p>
            <div class="inline-block bg-blue-50 border border-blue-100 rounded-full px-4 py-1 mt-2">
                <span class="text-[10px] font-bold text-blue-600 tracking-wider uppercase">
                    Assignment Cover Page Generator System
                </span>
            </div>
        </header>

        <main class="w-full max-w-[1680px] mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
            
            <div class="lg:col-span-5 bg-white border border-slate-200 shadow-xs rounded-2xl p-5 md:p-6 space-y-5">
                
                <div>
                    <label class="premium-label !text-slate-400 !font-black tracking-wider mb-3">Choose a Template</label>
                    <div class="grid grid-cols-1 gap-2">
                        <button onclick="switchTemplate(1)" id="btn-t1" class="text-left p-3.5 rounded-xl border-2 border-blue-600 bg-blue-50/60 transition-all w-full">
                            <span class="block text-xs font-bold text-blue-950">Template 1</span>
                        </button>
                        <button onclick="switchTemplate(2)" id="btn-t2" class="text-left p-3.5 rounded-xl border-2 border-slate-200 hover:border-slate-300 hover:bg-slate-50/50 transition-all w-full">
                            <span class="block text-xs font-bold text-slate-700">Template 2</span>
                        </button>
                        <button onclick="switchTemplate(3)" id="btn-t3" class="text-left p-3.5 rounded-xl border-2 border-slate-200 hover:border-slate-300 hover:bg-slate-50/50 transition-all w-full">
                            <span class="block text-xs font-bold text-slate-700">Template 3</span>
                        </button>
                        <button onclick="switchTemplate(4)" id="btn-t4" class="text-left p-3.5 rounded-xl border-2 border-slate-200 hover:border-slate-300 hover:bg-slate-50/50 transition-all w-full">
                            <span class="block text-xs font-bold text-slate-700">Template 4</span>
                        </button>
                        <button onclick="switchTemplate(5)" id="btn-t5" class="text-left p-3.5 rounded-xl border-2 border-slate-200 hover:border-slate-300 hover:bg-slate-50/50 transition-all w-full">
                            <span class="block text-xs font-bold text-slate-700">Template 5</span>
                        </button>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="premium-label">Assignment Topic Title</label>
                        <textarea id="inTitle" oninput="syncEngine()" rows="2" placeholder="Write comprehensive topic title here..." class="premium-input resize-none font-bold text-sm"></textarea>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                        <div>
                            <label class="premium-label">Course Title</label>
                            <input type="text" id="inCourseTitle" placeholder="e.g., Physical Chemistry" oninput="syncEngine()" class="premium-input">
                        </div>
                        <div>
                            <label class="premium-label">Course Code</label>
                            <input type="text" id="inCourseCode" placeholder="e.g., CHEM-402" oninput="syncEngine()" class="premium-input">
                        </div>
                    </div>

                    <div class="border-t border-slate-100 pt-4">
                        <span class="block text-[10px] font-black text-blue-600 uppercase tracking-widest mb-3">Student Details</span>
                        <div class="mb-3">
                            <label class="premium-label !text-slate-400">Full Name of Student</label>
                            <input type="text" id="inStudentName" placeholder="Enter student full name" oninput="syncEngine()" class="premium-input font-semibold">
                        </div>
                        <div class="grid grid-cols-2 gap-3 mb-3">
                            <div>
                                <label class="premium-label !text-slate-400">Class Roll Number</label>
                                <input type="text" id="inRoll" placeholder="e.g., 4102" oninput="syncEngine()" class="premium-input">
                            </div>
                            <div>
                                <label class="premium-label !text-slate-400">Registration No</label>
                                <input type="text" id="inReg" placeholder="e.g., 182301..." oninput="syncEngine()" class="premium-input">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="premium-label !text-slate-400">Academic Year</label>
                                <input type="text" id="inYear" placeholder="e.g., 4th Year" oninput="syncEngine()" class="premium-input">
                            </div>
                            <div>
                                <label class="premium-label !text-slate-400">Session</label>
                                <input type="text" id="inSession" placeholder="e.g., 2021-22" oninput="syncEngine()" class="premium-input">
                            </div>
                        </div>
                    </div>

                    <div class="border-t border-slate-100 pt-4">
                        <span class="block text-[10px] font-black text-amber-600 uppercase tracking-widest mb-3">Evaluator Credentials</span>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="premium-label !text-slate-400">Teacher Full Name</label>
                                <input type="text" id="inTeacherName" placeholder="Enter instructor name" oninput="syncEngine()" class="premium-input font-semibold">
                            </div>
                            <div>
                                <label class="premium-label !text-slate-400">Academic Designation</label>
                                <input type="text" id="inDesignation" placeholder="e.g., Assistant Professor" oninput="syncEngine()" class="premium-input">
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="premium-label">Submission Timeline Date</label>
                        <input type="text" id="inDate" placeholder="e.g., 02/05/2026" oninput="syncEngine()" class="premium-input font-medium">
                    </div>
                </div>

                <button onclick="triggerPdfExport()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-md transition-all uppercase text-[11px] tracking-widest pt-1">
                    Download Cover Page PDF
                </button>
            </div>

            <div class="lg:col-span-7 w-full flex flex-col justify-center">
                <div class="preview-wrapper">
                    <div class="preview-scale">
                        <div id="renderTarget" class="pdf-page-container text-slate-900 shadow-xs">
                            </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <footer class="w-full bg-white border-t border-slate-200 py-4 px-6 text-center text-xs text-slate-500 font-medium">
        <div>
            © 2026 Develop by 
            <a href="https://www.facebook.com/sofian.68" target="_blank" class="text-blue-600 hover:text-blue-700 font-bold transition-all underline underline-offset-4 decoration-blue-500/30 ml-0.5">
                Md. Abu Sofian
            </a>
        </div>
    </footer>

    <script>

            return value.trim() === "" ? `<span style="color: #94A3B8; font-weight: 400; letter-spacing: 0px;">${filler}</span>` : value;
        }

                        ${data.title.trim() === "" ? "<span style='color: #CBD5E1; font-style: italic; font-weight:500;'>[ ENTER TOPIC MANUSCRIPT TITLE ]</span>" : data.title}

                            <h4 style="font-family: 'Montserrat', sans-serif; font-size: 11pt; font-weight: 900; color: #B45309; text-transform: uppercase; letter-spacing: 1px; border-bottom: 2px solid #E2E8F0; padding-bottom: 6px; margin: 0 0 14px 0;">SUBMITTED TO</h4>
                            <div style="font-family: 'Inter', sans-serif; font-size: 11pt; line-height: 2.0; color: #1E293B;">
                                <strong style="color: #0F172A; font-weight: 700;">Instructor Full Name:</strong> ${fallbackCheck(data.teacher)}<br>
                                <strong style="color: #0F172A; font-weight: 700;">Faculty Rank:</strong> ${fallbackCheck(data.designation)}<br>
                                <strong style="color: #0F172A; font-weight: 700;">Department Unit:</strong> Department of Chemistry<br>
                                <strong style="color: #0F172A; font-weight: 700;">Institution Canvas:</strong> Patiya Govt. College
                            </div>

                    <div style="text-align: center; border-top: 1px solid #E2E8F0; padding-top: 18px;">
                        <p style="font-family: 'Montserrat', sans-serif; font-size: 10.5pt; font-weight: 800; color: #475569; text-transform: uppercase; letter-spacing: 2px; margin: 0;">

                    </div>

            </div>`;
        }

        function generateTemplate2(data) {

        function generateTemplate3(data) {
            return `
            <div style="display: flex; flex-direction: column; height: 100%; justify-content: space-between; box-sizing: border-box;">
                <div style="text-align: center;">
                    <div style="display: inline-block; width: 85px; height: 85px; margin-bottom: 15px;">

                <div style="text-align: center; padding: 10px 0; flex-grow: 1; display: flex; flex-direction: column; justify-content: center;">

        // WORKSPACE RUNTIME SYNCHRONIZATION ENGINE
        function syncEngine() {
            const payload = {
                title: document.getElementById('inTitle').value,
                courseTitle: document.getElementById('inCourseTitle').value,
                courseCode: document.getElementById('inCourseCode').value,
                studentName: document.getElementById('inStudentName').value,
                roll: document.getElementById('inRoll').value,
                reg: document.getElementById('inReg').value,
                year: document.getElementById('inYear').value,
                session: document.getElementById('inSession').value,
                teacher: document.getElementById('inTeacherName').value,
                designation: document.getElementById('inDesignation').value,
                date: document.getElementById('inDate').value
            };

            let compiledHtml = "";
            switch(activeTemplateId) {
                case 1: compiledHtml = generateTemplate1(payload); break;
                case 2: compiledHtml = generateTemplate2(payload); break;
                case 3: compiledHtml = generateTemplate3(payload); break;
                case 4: compiledHtml = generateTemplate4(payload); break;
                case 5: compiledHtml = generateTemplate5(payload); break;
            }
            
            document.getElementById('renderTarget').innerHTML = compiledHtml;
        }

        // TEMPLATE BLUEPRINT SWITCH MATRIX
        function switchTemplate(id) {
            activeTemplateId = id;
            for(let i = 1; i <= 5; i++) {
                const btn = document.getElementById(`btn-t${i}`);
                if(i === id) {
                    btn.className = "text-left p-3.5 rounded-xl border-2 border-blue-600 bg-blue-50/60 transition-all w-full";
                    btn.firstElementChild.className = "block text-xs font-bold text-blue-950";
                } else {
                    btn.className = "text-left p-3.5 rounded-xl border-2 border-slate-200 hover:border-slate-300 hover:bg-slate-50/50 transition-all w-full";
                    btn.firstElementChild.className = "block text-xs font-bold text-slate-700";
                }
            }
            syncEngine();
        }

        // ANTI-DISPLACEMENT HIGH RESOLUTION EXPORT CONTROLLER (Strict 300 DPI Rendering Matrix)
        function triggerPdfExport() {
            const target = document.getElementById('renderTarget');
            const student = document.getElementById('inStudentName').value.trim() || "CoverPage";
            const course = document.getElementById('inCourseCode').value.trim() || "Academic";
            
            const config = {
                margin: 0,
                filename: `${student.replace(/\s+/g, '_')}_${course}_Pro_Cover.pdf`,
                image: { type: 'jpeg', quality: 1.0 },
                html2canvas: { 
                    scale: 3.5, // High resolution pixel mapping
                    useCORS: true, 
                    letterRendering: true,
                    dpi: 300,
                    backgroundColor: '#FFFFFF',
                    width: 794,
                    height: 1123,
                    scrollX: 0,
                    scrollY: 0
                },
                jsPDF: { unit: 'px', format: [794, 1123], orientation: 'portrait' }
            };

            html2pdf().set(config).from(target).save();
        }

        window.onload = function() {
            syncEngine();
        };
